<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wello — Design Result</title>
<style>
@font-face{font-family:"Creato Display";src:url("../fonts/CreatoDisplay-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Creato Display";src:url("../fonts/CreatoDisplay-Medium.woff2") format("woff2");font-weight:500 600}
@font-face{font-family:"Asta Sans";src:url("../fonts/AstaSans-Variable.woff2") format("woff2");font-weight:300 800}
:root{--ink:#1E1F22;--muted:#8A8F98;--blue:#2B9CFF;--spring:cubic-bezier(.3,1.15,.4,1);--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden}
body{font-family:"Asta Sans","Creato Display",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.cv{position:absolute;left:0;top:0;width:1920px;height:1642px;transform-origin:0 0}
.bx{position:absolute;border-radius:24px;overflow:hidden;background:#F6F6F7;
  opacity:0;transform:translateY(60px) scale(.98);transition:opacity .9s var(--ease),transform 1.1s var(--ease),box-shadow .5s ease}
.on .bx{opacity:1;transform:none}
.bx:hover{transform:translateY(-6px);box-shadow:0 30px 60px -28px rgba(20,40,80,.28)}
.cap{position:absolute;left:28px;bottom:24px;font-family:"Creato Display",sans-serif;font-size:14px;font-weight:500;letter-spacing:.2px;color:#8A8F98;text-transform:uppercase;z-index:3}
.cap.w{color:rgba(255,255,255,.7)}
.img{position:absolute;inset:0;background-size:cover;background-position:center;transition:transform 1.4s var(--ease)}
.bx:hover .img{transform:scale(1.05)}
/* 1 house */
.b1 .img{background-image:url(img/house.webp)}
.pulse{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--blue);box-shadow:0 0 0 0 rgba(43,156,255,.5);animation:pl 2.2s ease-out infinite;z-index:2}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(43,156,255,.55)}100%{box-shadow:0 0 0 22px rgba(43,156,255,0)}}
/* 2 notifications */
.b2{background:linear-gradient(160deg,#EAF4FF 0%,#F6F9FF 55%,#FFFFFF 100%)}
.nt{position:absolute;left:44px;right:44px;height:104px;border-radius:26px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  box-shadow:0 18px 40px -22px rgba(30,60,110,.35),inset 0 0 0 1px rgba(255,255,255,.9);display:flex;align-items:center;gap:16px;padding:0 22px;
  transition:transform .9s var(--spring),opacity .6s ease}
.nt .ic{width:56px;height:56px;border-radius:14px;flex:none;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);display:flex;align-items:center;justify-content:center;color:var(--blue)}
.nt .ic svg{width:34px;height:34px}
.nt h4{font-size:17px;font-weight:600;letter-spacing:-.3px}
.nt p{font-size:14px;color:#5B616B;margin-top:4px;letter-spacing:-.2px;line-height:1.35}
.nt time{position:absolute;right:22px;top:20px;font-size:12.5px;color:#9A9EA6}
/* 3 phone */
.b3{background:linear-gradient(180deg,#F6F6F7 0%,#EAF2FC 100%)}
.b3 iframe{position:absolute;left:50%;top:48px;width:520px;height:1013px;margin-left:-260px;border:0;pointer-events:none}
/* 4 app */
.b4{background:linear-gradient(165deg,#5CB5FF 0%,#2B9CFF 45%,#0E7DFB 100%);color:#fff}
.app{position:absolute;left:50%;top:44%;width:132px;height:132px;margin:-66px 0 0 -66px;border-radius:30px;background:#fff;box-shadow:0 24px 50px -18px rgba(0,40,120,.45);display:flex;align-items:center;justify-content:center;color:var(--blue);transition:transform .8s var(--spring)}
.app svg{width:84px;height:84px}
.app g{transform-box:fill-box;transform-origin:50% 50%;transition:transform 1.2s cubic-bezier(.65,0,.35,1)}
.b4:hover .app{transform:translateY(-8px) rotate(-4deg)}
.b4:hover .app g{transform:rotate(360deg)}
.b4 .nm{position:absolute;left:0;right:0;top:calc(44% + 92px);text-align:center;font-family:"Creato Display",sans-serif;font-size:26px;font-weight:500;letter-spacing:-.5px}
.b4 .sub{position:absolute;left:0;right:0;top:calc(44% + 128px);text-align:center;font-size:14px;opacity:.75}
/* 5 forecast */
.b5{padding:26px 26px}
.b5 .lb{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;color:#3A3D42}
.b5 .lb svg{width:18px;height:18px}
.b5 .v{position:absolute;left:26px;bottom:62px;font-family:"Creato Display",sans-serif;font-size:58px;font-weight:500;letter-spacing:-2.5px;font-variant-numeric:tabular-nums}
.b5 .v small{font-size:20px;color:var(--muted);letter-spacing:0;margin-left:6px}
.bars{position:absolute;left:26px;right:26px;bottom:26px;height:26px;display:flex;align-items:flex-end;gap:5px}
.bars i{flex:1;border-radius:3px;background:#DCE9F8;height:20%;transition:height 1s var(--spring)}
.bars i.hi{background:var(--blue)}
/* 6 island */
.b6{background:#0D0D0D}
.pill{position:absolute;left:50%;top:50%;width:200px;height:56px;margin:-28px 0 0 -100px;border-radius:28px;background:#000;box-shadow:inset 0 0 0 1px #1A1B1D;transition:width .7s var(--spring),margin .7s var(--spring)}
.b6:hover .pill{width:236px;margin-left:-118px}
.pill .mk{position:absolute;left:14px;top:10px;width:36px;height:36px;color:#fff}
.pill .mk g{transform-box:fill-box;transform-origin:50% 50%;animation:sp 2.4s cubic-bezier(.65,0,.35,1) infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.pill .rg{position:absolute;right:12px;top:10px;width:36px;height:36px}
/* 7 schedule */
.b7 .img{background-image:url(img/schedule.webp)}
.now{position:absolute;top:13%;bottom:0;width:2px;background:var(--blue);left:8%;z-index:2;animation:nw 9s linear infinite;opacity:.85}
.now::before{content:"";position:absolute;left:-5px;top:-6px;width:12px;height:12px;border-radius:50%;background:var(--blue)}
@keyframes nw{from{left:8%}to{left:92%}}
/* 8 report */
.b8 .img{background-image:url(img/report.webp);background-size:100% auto;background-position:center top}
/* 9 live activity */
.b9{background:radial-gradient(120% 90% at 20% 0%,#24344F 0%,#0D0D0D 60%)}
.la{position:absolute;left:44px;right:44px;top:50%;transform:translateY(-50%);border-radius:44px;background:#000;padding:26px;box-shadow:0 30px 70px -30px rgba(0,0,0,.8),inset 0 0 0 1px #1A1B1D;color:#fff}
.la .r1{display:flex;align-items:center;gap:14px}
.la .r1 svg{width:44px;height:44px;color:#fff}
.la .r1 g{transform-box:fill-box;transform-origin:50% 50%;animation:sp 2.4s cubic-bezier(.65,0,.35,1) infinite}
.la .k{font-size:12px;color:#8E8E93;font-family:"Creato Display",sans-serif}
.la .t{font-size:19px;font-weight:600;letter-spacing:-.4px}
.la .r2{position:relative;margin-top:18px;height:96px;border-radius:24px;background:#141517;display:flex;align-items:center;gap:20px;padding:0 24px}
.la .th{width:62px;height:62px;border-radius:50%;background:#1F2329;display:flex;align-items:center;justify-content:center;flex:none}
.la .th img{width:84%;height:84%}
.la .nm{font-size:17px;font-weight:600}
.la .ds{font-size:14px;color:#8E8E93;margin-top:3px}
.la .ch{position:absolute;right:24px;top:22px;height:24px;padding:0 10px;border-radius:12px;background:#1F2329;font-size:12px;line-height:24px;color:#E5E5EA;font-variant-numeric:tabular-nums}
.la .bar{position:absolute;left:106px;right:24px;bottom:18px;height:5px;border-radius:3px;background:#282D35;overflow:hidden}
.la .bar i{position:absolute;left:0;top:0;bottom:0;width:40%;border-radius:3px;background:linear-gradient(90deg,#4DBCFF,#0E7DFB)}
</style></head><body>
