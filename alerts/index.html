<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>알림 — Wello</title>
<style>
@font-face{font-family:"Asta Sans";src:url("../fonts/AstaSans-Variable.woff2") format("woff2");font-weight:300 800}
@font-face{font-family:"Creato Display";src:url("../fonts/CreatoDisplay-Regular.woff2") format("woff2");font-weight:400}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent;overflow:hidden}
body{-webkit-font-smoothing:antialiased;color:#000}
.st{position:absolute;left:0;top:0;width:904px;height:1064px;transform-origin:0 0}
.n{position:absolute;left:148px;top:0;width:608px;height:148px;border-radius:31px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.55);font-family:"Asta Sans",sans-serif}
.n > svg{position:absolute;inset:0;width:608px;height:148px}
.n b{position:absolute;left:147px;top:32px;font-size:23px;line-height:28px;font-weight:600;letter-spacing:-1px;white-space:nowrap}
.n p{position:absolute;left:147px;top:71px;width:330px;font-size:17.5px;line-height:23px;font-weight:500;word-break:keep-all}
.n em{position:absolute;right:36px;top:33px;font-style:normal;font-size:20.5px;line-height:24px}
/* v1: 한 장씩 교체 */
.v1 .n{top:var(--cy,458px);transition:transform .8s cubic-bezier(.22,.8,.2,1),opacity .6s,filter .6s}
.v1 .n.out{transform:translateY(-28px) scale(.97);opacity:0;filter:blur(6px)}
.v1 .n.pre{transform:translateY(28px) scale(.97);opacity:0;filter:blur(6px)}
/* v2: 세로 리스트 흐름 */
.v2 .rail{position:absolute;left:0;top:0;width:904px;will-change:transform}
.v2 .mask{position:absolute;inset:0;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 22%,#000 78%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 22%,#000 78%,transparent 100%)}
/* v3: 잠금화면 */
.ph{position:absolute;left:232px;top:120px;width:440px;height:900px;border-radius:64px;background:#0d1b2e;padding:12px;box-shadow:0 40px 80px rgba(0,30,80,.35)}
.ph .scr{position:relative;width:100%;height:100%;border-radius:54px;overflow:hidden;background:url(../assets/alert-blue.webp) center/cover}
.ph .scr::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,20,60,.25),rgba(0,0,0,0) 40%)}
.ph .isl{position:absolute;left:50%;top:14px;width:110px;height:32px;margin-left:-55px;border-radius:16px;background:#000}
.ph .dt{position:absolute;left:0;right:0;top:70px;text-align:center;color:#fff;font-family:"Asta Sans";font-size:17px;font-weight:500}
.ph .tm{position:absolute;left:0;right:0;top:92px;text-align:center;color:#fff;font-family:"Creato Display";font-size:92px;letter-spacing:-3px;line-height:1}
.v3 .lst{position:absolute;left:12px;top:300px;width:392px}
.v3 .n{left:0;transform-origin:0 0;transition:transform .8s cubic-bezier(.22,.8,.2,1),opacity .6s}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="st" id="st"></div>
<script>
{
  const st = document.getElementById('st');
  const QH = +(location.search.match(/h=(\d+)/) || [0, 1064])[1], QY = +(location.search.match(/[?&]y=(\d+)/) || [0, 458])[1];
  st.style.height = QH + 'px'; document.documentElement.style.setProperty('--cy', QY + 'px');
  const fit = () => st.style.transform = `scale(${innerWidth / 904})`;
  addEventListener('resize', fit); fit();
  const V = (location.search.match(/v=(\d)/) || [0, '1'])[1];
  st.className = 'st v' + V;
  const N = [
    ['예상 발전량이 낮아졌어요.', '비 예보로 태양광 발전량이 줄어 세탁이 계획보다 늦게 끝날 수 있어요. WELLO에서 확인해보세요!', '10분 전'],
    ['세탁 시작 시간을 옮겼어요.', '구름이 걷히는 오후 2시 10분으로 미뤘어요. 오후 6시 전에는 세탁이 끝날 예정이에요.', '방금'],
    ['발전 피크가 시작됐어요.', '지금 건조기를 돌리면 태양광으로 88%를 채울 수 있어요. 바로 시작해볼까요?', '방금'],
    ['세탁이 끝났어요.', '태양광으로 92%를 채워 오늘 1,240원을 아꼈어요. 건조기도 이어서 돌려볼까요?', '방금'],
    ['남는 전기가 생기고 있어요.', '지금 쓰는 양보다 4.2kW 더 만들고 있어요. 미뤄둔 식기세척기를 돌려보세요!', '방금'],
    ['스타일러 예약을 마쳤어요.', '내일 오전 11시에 시작해 출근 준비 전에 끝나요. 태양광으로 90%를 채워요.', '방금'],
    ['내일은 맑아요.', '오전 10시부터 오후 2시까지 발전이 가장 좋아요. 세탁기 예약을 미리 해둘까요?', '방금'],
    ['전력망 사용이 늘었어요.', '해가 진 뒤 에어컨이 켜져 있어요. 내일 낮 시간으로 운전을 옮기면 아낄 수 있어요.', '방금'],
  ];
  const BG = `<svg viewBox="0 0 608 148"><rect width="607.516" height="148" rx="31.0323" fill="#F6F6F7" fill-opacity="0.2"/><g transform="translate(33.4197 31.4727)"><rect width="85.9355" height="85.9355" rx="17.9032" fill="white"/><path d="M63.0097 16.8935H62.2142V12.8874H60.8706V12.2227H64.3533V12.8874H63.0097V16.8935ZM69.7452 16.8935H68.985V13.085L67.6415 16.8935H66.952L65.6261 13.085V16.8935H64.8483V12.2227H66.0504L67.3056 15.7797L68.5607 12.2227H69.7452V16.8935Z" fill="#2B9CFF"/><path d="M11.8096 44.3311C11.5062 43.186 11.5103 42.0077 11.784 40.8882C12.1573 39.3667 13.7023 39.0288 15.172 39.2372L18.2438 39.6729L22.4241 40.3426C26.2997 40.9631 32.7615 41.628 36.5341 41.3117C38.1746 41.1735 39.7351 40.5921 40.6075 39.1671C41.1328 38.3079 41.3722 37.3219 41.3884 36.3028C41.4355 33.2484 40.5779 27.1435 39.982 23.9508L38.6677 16.9092C38.5083 16.0547 38.3771 15.2448 38.369 14.3849C38.3549 12.8256 39.4466 11.8888 40.9384 11.6548C42.0368 11.4828 43.1305 11.4855 44.2282 11.6589C45.7341 11.8976 46.6617 12.8249 46.6442 14.3855C46.6348 15.2771 46.4969 16.1053 46.3153 16.9895C44.9317 23.7377 43.9107 29.6591 44.2403 36.6272L44.2154 38.3288C44.1932 39.824 43.5589 41.2187 42.5002 42.2876C41.4812 43.3161 40.136 43.9042 38.6845 44.0344C37.6715 44.1254 36.6996 44.056 35.6887 44.0189C30.5862 43.8287 25.4044 44.3938 20.3666 45.166L15.8177 45.8634C15.1363 45.9679 14.4704 46.0023 13.7978 45.9578C12.8353 45.8944 12.0679 45.3057 11.8096 44.3311Z" fill="#2B9CFF"/><path d="M46.5701 70.7619C46.7651 72.0433 45.9957 73.034 44.6686 73.3226C43.5016 73.5762 42.3239 73.5708 41.1374 73.4245C39.9173 73.2741 38.8203 72.63 38.7005 71.3554C38.64 70.7059 38.6918 70.0504 38.8088 69.3942L39.6832 64.4702C40.1709 61.7287 40.5273 59.0438 40.7816 56.2612C41.0318 53.5143 41.1078 50.8503 40.8737 48.1095C40.5724 44.5796 42.8115 41.7962 46.3044 41.3875L48.5099 41.3471C50.4188 41.4172 52.2456 41.4031 54.1646 41.2823C57.2492 41.0881 60.2443 40.7644 63.2919 40.268L68.1495 39.4769L70.9718 39.2004C71.487 39.1498 72.0406 39.3171 72.467 39.5895C73.7739 40.4251 73.7463 43.0756 73.3165 44.5013C73.0441 45.4057 72.2894 45.919 71.3801 45.9601C70.4976 46.0006 69.6508 45.9217 68.7683 45.7848L63.3524 44.9451C59.117 44.2882 52.4333 43.6745 48.3054 44.1082C46.0629 44.3442 44.4628 45.4361 43.887 47.6569C43.6301 48.647 43.6429 49.6242 43.7209 50.677C44.1554 56.5323 44.9794 62.2972 46.1558 68.0446L46.5701 70.7619Z" fill="#2B9CFF"/></g></svg>`;
  const card = ([t, d, w]) => { const e = document.createElement('div'); e.className = 'n';
    e.innerHTML = `${BG}<b>${t}</b><em>${w}</em><p>${d}</p>`; return e; };
  let vis = true;
  if ('IntersectionObserver' in window) new IntersectionObserver(es => vis = es[0].isIntersecting).observe(document.body);
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const every = (ms, f) => { if (!still) setInterval(() => { if (vis && !document.hidden) f(); }, ms); };
  let k = 0;

  if (V === '1'){
    let cur = card(N[0]); st.appendChild(cur); k = 1;
    every(3400, () => {
      const nx = card(N[k++ % N.length]); nx.classList.add('pre'); st.appendChild(nx);
      cur.classList.add('out'); const old = cur; setTimeout(() => old.remove(), 800);
      void nx.offsetWidth; setTimeout(() => nx.classList.remove('pre'), 30); cur = nx;
    });
  }
  if (V === '2'){
    const mask = document.createElement('div'); mask.className = 'mask'; st.appendChild(mask);
    const rail = document.createElement('div'); rail.className = 'rail'; mask.appendChild(rail);
    const STEP = 148 + 18, list = [...N, ...N];
    list.forEach((m, i) => { const e = card(m); e.style.top = (i * STEP) + 'px'; rail.appendChild(e); });
    let y = 120, last = performance.now(); const H = N.length * STEP;
    const tick = t => { const dt = Math.min(50, t - last); last = t; if (vis && !still) { y -= dt * 0.035; if (y < 120 - H) y += H; }
      rail.style.transform = `translateY(${y}px)`; requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }
  if (V === '3'){
    st.innerHTML = `<div class="ph"><div class="scr"><div class="isl"></div><div class="dt">11월 26일 목요일</div><div class="tm">14:43</div><div class="lst" id="lst"></div></div></div>`;
    const lst = document.getElementById('lst'), S = 392 / 608, GAP = 10;
    let shown = [];
    const place = () => shown.forEach((e, j) => { e.style.opacity = j > 3 ? 0 : 1; e.style.transform = `translateY(${j * (148 * S + GAP)}px) scale(${S})`; });
    for (let i = 0; i < 3; i++){ const e = card(N[i]); lst.appendChild(e); shown.push(e); } k = 3; place();
    every(3000, () => {
      const e = card(N[k++ % N.length]); e.style.opacity = 0; e.style.transform = `translateY(-40px) scale(${S})`; lst.prepend(e);
      shown.unshift(e); void e.offsetWidth; place();
      shown.splice(5).forEach(o => setTimeout(() => o.remove(), 800));
    });
  }
}
</script></body></html>
