<title>Dynamic Island — Wello</title>
<style>
@font-face{font-family:"Creato Display";src:url("../fonts/CreatoDisplay-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"Creato Display";src:url("../fonts/CreatoDisplay-Medium.woff2") format("woff2");font-weight:500 600}
@font-face{font-family:"Asta Sans";src:url("../fonts/AstaSans-Variable.woff2") format("woff2");font-weight:300 800}
:root{--ink:#0D0D0D;--sub:#3A3D42;--blue:#2B9CFF;--ease:cubic-bezier(.22,.8,.2,1);--spring:cubic-bezier(.32,1.08,.42,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#F5F5F5;overflow:hidden}
body{font-family:"Creato Display","Asta Sans",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.cv{position:absolute;left:0;top:0;width:1920px;height:1525px;transform-origin:0 0}
.hd{position:absolute;left:0;top:248px;width:1920px}
.hd .no,.hd .tt{position:absolute;top:-8px;font-size:27px;font-weight:500;letter-spacing:-1px}
.hd .no{left:195px}.hd .tt{left:303px}
.hd p{position:absolute;left:1121px;top:-14px;font-family:"Asta Sans",sans-serif;font-size:18.5px;line-height:34px;color:var(--ink);letter-spacing:-.5px}
.box{position:absolute;left:40px;top:452px;width:1840px;height:913px;background:#fff;border-radius:24px;overflow:hidden}

/* phone */
.ph{position:absolute;left:600px;top:110px;width:640px;height:1320px;border-radius:118px;padding:11px;
  background:linear-gradient(90deg,#B9BCC1 0%,#ECEDEF 4%,#D9DBDF 12%,#E6E7EA 50%,#D9DBDF 88%,#ECEDEF 96%,#B4B7BC 100%);
  box-shadow:0 40px 90px rgba(20,30,50,.10),inset 0 0 0 1px rgba(0,0,0,.08)}
.ph::before{content:"";position:absolute;left:-5px;top:250px;width:5px;height:64px;border-radius:3px 0 0 3px;background:#C9CBCF;box-shadow:0 110px 0 #C9CBCF,0 200px 0 #C9CBCF}
.ph::after{content:"";position:absolute;right:-5px;top:330px;width:5px;height:120px;border-radius:0 3px 3px 0;background:#C9CBCF}
.bz{position:relative;width:100%;height:100%;border-radius:107px;background:#050506;padding:11px}
.sc{position:relative;width:100%;height:100%;border-radius:96px;overflow:hidden;
  background:
   radial-gradient(60% 40% at 20% 8%,rgba(255,255,255,.75),rgba(255,255,255,0) 70%),
   radial-gradient(70% 45% at 85% 30%,#9FB6D4 0%,rgba(159,182,212,0) 70%),
   radial-gradient(80% 50% at 30% 60%,#6F7C8F 0%,rgba(111,124,143,0) 70%),
   linear-gradient(160deg,#C9D2DE 0%,#8D99AA 45%,#5D6676 100%)}
.sc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,0) 30%)}
.sb{position:absolute;left:0;right:0;top:0;height:90px;color:#fff;font-family:"Asta Sans",sans-serif;z-index:1}
.sb .tm{position:absolute;left:82px;top:30px;font-size:26px;font-weight:600;letter-spacing:-.3px}
.sb .ic{position:absolute;right:54px;top:34px;display:flex;gap:8px;align-items:center;transform:scale(.9);transform-origin:100% 50%}

/* island */
.di{position:absolute;left:50%;top:17px;width:190px;height:56px;margin-left:-95px;border-radius:28px;background:#000;z-index:3;overflow:hidden;
  transition:width .62s var(--spring),height .62s var(--spring),margin-left .62s var(--spring),border-radius .62s var(--spring),top .62s var(--spring)}
.di.cp{width:236px;margin-left:-118px}
.di.ex{width:540px;height:200px;margin-left:-270px;top:14px;border-radius:56px}
.cpl,.cpr{position:absolute;top:10px;opacity:0;transition:opacity .25s ease}
.cpl{left:16px}.cpr{right:14px}
.di.cp .cpl,.di.cp .cpr{opacity:1;transition-delay:.25s}
.xc{position:absolute;left:0;top:0;width:540px;height:200px;padding:24px 26px 0;opacity:0;filter:blur(6px);transform:scale(.96);transform-origin:50% 0;
  transition:opacity .22s ease,filter .22s ease,transform .3s ease;font-family:"Asta Sans",sans-serif}
.di.ex.on .xc{opacity:1;filter:none;transform:none;transition:opacity .4s ease,filter .4s ease,transform .5s var(--spring)}
.r1{display:flex;align-items:center;gap:14px}
.r1 .ai{width:44px;height:44px;display:block;flex:none;overflow:visible}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:spin 2.4s cubic-bezier(.65,0,.35,1) infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.r1 .k{font-size:13px;color:#8E8E93;letter-spacing:.2px;font-family:"Creato Display",sans-serif;font-weight:500}
.r1 .t{font-size:21px;color:#fff;font-weight:600;letter-spacing:-.4px;margin-top:1px}
.r2{position:relative;margin-top:16px;height:94px;border-radius:26px;background:#1C1C1E;padding:15px 18px 0 16px;display:flex;gap:14px}
.th{width:56px;height:56px;border-radius:12px;background:#fff;overflow:hidden;flex:none;margin-top:-1px}
.th img{width:100%;height:100%;display:block}
.nm{font-size:16px;color:#fff;font-weight:600;letter-spacing:-.3px;margin-top:4px}
.ds{font-size:13px;color:#8E8E93;letter-spacing:-.2px;margin-top:3px}
.ch{position:absolute;right:16px;top:14px;height:26px;padding:0 11px;border-radius:13px;background:#2C2C2E;color:#E5E5EA;font-size:12.5px;line-height:26px;letter-spacing:-.2px;font-variant-numeric:tabular-nums}
.bar{position:absolute;left:86px;right:18px;bottom:15px;height:5px;border-radius:3px;background:#3A3A3C;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:linear-gradient(90deg,#4DBCFF,#0E7DFB)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>

<script>
(() => {
  const cv = document.getElementById('cv'), di = document.getElementById('di');
  const bf = document.getElementById('bf'), mn = document.getElementById('mn'), ring = document.getElementById('ring'), pv = document.getElementById('pv');
  const fit = () => cv.style.transform = `scale(${innerWidth / 1920})`;
  fit(); addEventListener('resize', fit);
  const sl = ms => new Promise(r => setTimeout(r, ms));
  let p = .38, raf = 0;
  const setP = v => { p = v; bf.style.width = (v * 100).toFixed(2) + '%'; ring.setAttribute('stroke-dashoffset', (81.68 * (1 - v)).toFixed(2)); mn.textContent = Math.max(1, Math.round(62 * (1 - v))); };
  const tween = (to, d) => new Promise(res => { cancelAnimationFrame(raf); const f = p, t0 = performance.now();
    const st = n => { const k = Math.min(1, (n - t0) / d), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2; setP(f + (to - f) * e); if (k < 1) raf = requestAnimationFrame(st); else res(); };
    raf = requestAnimationFrame(st); });
  (async () => {
    for (;;) {
      setP(.38); pv.textContent = 92;
      di.className = 'di'; await sl(1200);
      di.className = 'di cp'; await sl(1500);
      di.className = 'di ex'; await sl(560);
      di.classList.add('on'); await sl(700);
      await tween(.56, 2600); pv.textContent = 94;
      await tween(.66, 1600); await sl(900);
      di.classList.remove('on'); await sl(260);
      di.className = 'di cp'; await sl(1700);
    }
  })();
})();
</script>
