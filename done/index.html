<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 결과 — 월패드 인터랙티브</title>
<style>
@font-face{font-family:"Creato Display";src:url("../fonts/CreatoDisplay-Light.woff2") format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"Creato Display";src:url("../fonts/CreatoDisplay-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Creato Display";src:url("../fonts/CreatoDisplay-Medium.woff2") format("woff2");font-weight:500 600;font-display:swap}
@font-face{font-family:"Asta Sans";src:url("../fonts/AstaSans-Variable.woff2") format("woff2");font-weight:300 800;font-display:swap}
:root{--bg:#EEEEEF;--panel:#F7F7F8;--ink:#1E1F22;--muted:#8A8F98;--sub:#3A3D42;--blue:#2B9CFF;--ease:cubic-bezier(.22,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#EEEEEF;overflow:hidden}
body{font-family:"Creato Display","Asta Sans",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num{font-variant-numeric:tabular-nums}
.stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;border-radius:24px;overflow:hidden;background:var(--bg);transform-origin:center}
.under{position:absolute;inset:0;width:1280px;height:720px;border:0}
.ov{position:absolute;inset:0;background:var(--bg);cursor:pointer;opacity:0;transform:scale(1.02);pointer-events:none;transition:opacity .45s,transform .6s var(--ease)}
.ov.open{opacity:1;transform:none;pointer-events:auto}
.again{position:absolute;right:32px;bottom:32px;height:48px;padding:0 20px 0 16px;border-radius:24px;background:#fff;box-shadow:0 8px 24px rgba(0,0,0,.1);display:flex;align-items:center;gap:8px;font-size:15px;
       opacity:0;transform:translateY(10px);pointer-events:none;transition:opacity .4s,transform .5s var(--ease)}
.again svg{width:18px;height:18px}
.again.on{opacity:1;transform:none;pointer-events:auto}

.panel{position:absolute;border-radius:24px;background:var(--panel)}
.a{opacity:0;transform:translateY(18px);transition:opacity .5s,transform .8s var(--ease)}
.in .a{opacity:1;transform:none}
.in .a.d1{transition-delay:.08s}.in .a.d2{transition-delay:.16s}.in .a.d3{transition-delay:.3s}.in .a.d4{transition-delay:.45s}

/* 왼쪽: 한 문장 + 그래프 */
.main{left:32px;top:32px;width:776px;height:656px}
.kick{position:absolute;left:48px;top:48px;height:36px;padding:0 16px 0 12px;border-radius:18px;background:#E3F1FF;color:#1C78CC;font-size:16px;display:flex;align-items:center;gap:8px}
.kick svg{width:18px;height:18px}
.hero{position:absolute;left:48px;top:108px;font-size:46px;font-weight:500;letter-spacing:-2px;line-height:1.22}
.hero b{color:var(--blue);font-weight:500}
.chart{position:absolute;left:48px;top:282px;width:680px;height:330px}
.chart svg{width:680px;height:330px;overflow:visible}
.chart text{font-family:"Creato Display","Asta Sans",sans-serif;font-size:15px;fill:var(--muted)}

/* 오른쪽: 큰 숫자 두 개 */
.card{left:824px;width:424px}
.c1{top:32px;height:320px}
.c2{top:368px;height:320px}
.card .lb{position:absolute;left:40px;top:40px;font-size:18px;color:var(--sub);letter-spacing:-.4px;display:flex;align-items:center;gap:8px}
.card .lb svg{width:20px;height:20px}
.card .big{position:absolute;left:40px;bottom:96px;display:flex;align-items:baseline;gap:8px}
.card .big b{font-size:72px;font-weight:300;letter-spacing:-4px;line-height:1}
.card .big span{font-size:24px;color:var(--muted)}
.c1 .big b{color:var(--blue)}
.card .ft{position:absolute;left:40px;bottom:44px;font-size:17px;color:var(--muted);letter-spacing:-.3px}
.card .ft b{color:var(--ink);font-weight:500}
.c2 .big b{font-size:52px;letter-spacing:-2.4px;font-weight:400}
.hint{position:absolute;right:40px;top:40px;font-size:15px;color:var(--muted);display:flex;align-items:center;gap:8px}
.hint i{width:32px;height:32px;border-radius:50%;background:#fff;display:grid;place-items:center}
.hint svg{width:14px;height:14px;stroke:var(--ink);stroke-width:2;fill:none;stroke-linecap:round}

.finger{position:absolute;left:0;top:0;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;z-index:60;pointer-events:none;background:rgba(30,31,34,.42);box-shadow:0 2px 10px rgba(0,0,0,.12),0 0 0 5px rgba(30,31,34,.08);opacity:0;transition:transform 1.1s cubic-bezier(.65,0,.35,1),opacity .6s}
.finger.show{opacity:1}
.finger::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid rgba(30,31,34,.45);opacity:0}
.finger.tap::after{animation:ripple 1s ease-out}
@keyframes ripple{0%{opacity:.6;scale:1}100%{opacity:0;scale:2}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}
</style>
<link rel="stylesheet" href="../ui/detail.css">
</head>
<body>
<div class="stage" id="stage">
  <iframe class="under" id="under" src="../schedule/" title="일정" tabindex="-1"></iframe>
  <button class="again" id="again"><svg viewBox="0 0 24 24"><path d="M12 2c.6 5.4 4.6 9.4 10 10-5.4.6-9.4 4.6-10 10-.6-5.4-4.6-9.4-10-10 5.4-.6 9.4-4.6 10-10Z" fill="#2B9CFF"/></svg>오늘 결과 다시 보기</button>

  <div class="ov" id="ov">
    <section class="panel main">
      <div class="kick a"><svg viewBox="0 0 24 24"><path d="M12 2c.6 5.4 4.6 9.4 10 10-5.4.6-9.4 4.6-10 10-.6-5.4-4.6-9.4-10-10 5.4-.6 9.4-4.6 10-10Z" fill="#2B9CFF"/></svg>오늘 예약 3건 완료</div>
      <div class="hero a d1">오늘은 태양광으로<br><b class="num" id="hPct">0%</b> 채웠어요</div>
      <div class="chart a d2"><svg viewBox="0 0 680 330" id="csv"></svg></div>
    </section>

    <section class="panel card c1">
      <div class="hint">누르면 닫혀요<i><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></i></div>
      <div class="lb a d2">아낀 전기요금</div>
      <div class="big a d3"><b class="num" id="save">0</b><span>원</span></div>
      <div class="ft a d4">바로 돌렸을 때보다 <b>46%p</b> 더 썼어요</div>
    </section>

    <section class="panel card c2">
      <div class="lb a d3"><svg viewBox="0 0 24 24" fill="none" stroke="#2B9CFF" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>내일도 맑아요</div>
      <div class="big a d4"><b class="num">10시 – 2시</b></div>
      <div class="ft a d4">이 시간에 돌리면 가장 많이 아껴요</div>
    </section>
  </div>

  <div class="finger" id="finger" aria-hidden="true"></div>
</div>
<script>
{
  const $ = s => document.querySelector(s);
  const stage = $('#stage');
  function fit(){ const s = Math.min(innerWidth/1280, innerHeight/720); stage.style.transform = `translate(-50%,-50%) scale(${s})`; }
  addEventListener('resize', fit); addEventListener('load', fit); fit();
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
  const STATIC = location.search.includes('static');

  /* ---------- 그래프: 발전 곡선 + 실제로 쓴 구간 + 가전 3개 ---------- */
  const NS = 'http://www.w3.org/2000/svg', svg = $('#csv');
  const mk = (t, a) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const W = 680, B = 220, TOP = 20;
  const T0 = 480, T1 = 1080;                              // 8AM ~ 6PM
  const x = t => (t - T0) / (T1 - T0) * W;
  const gen = t => Math.max(0, Math.sin(Math.PI * (t - 400) / (1160 - 400))) ** 1.6 * 3.4;
  const y = v => B - v / 3.4 * (B - TOP);
  const defs = mk('defs', {});
  defs.innerHTML = `<linearGradient id="gG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9CDD3" stop-opacity=".35"/><stop offset="1" stop-color="#C9CDD3" stop-opacity="0"/></linearGradient>
    <linearGradient id="gB" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B9CFF" stop-opacity=".55"/><stop offset="1" stop-color="#2B9CFF" stop-opacity=".06"/></linearGradient>
    <clipPath id="used"><rect x="${x(660)}" y="0" width="${x(790) - x(660)}" height="${B}"/><rect x="${x(800)}" y="0" width="${x(890) - x(800)}" height="${B}"/></clipPath>
    <clipPath id="wipe"><rect id="wr" x="0" y="0" width="0" height="340"/></clipPath>`;
  svg.appendChild(defs);
  let line = ''; for (let t = T0; t <= T1; t += 4) line += `${t === T0 ? 'M' : ' L'}${x(t).toFixed(1)} ${y(gen(t)).toFixed(1)}`;
  const area = line + ` L${W} ${B} L0 ${B} Z`;
  svg.appendChild(mk('line', { x1:0, x2:W, y1:B, y2:B, stroke:'#E1E3E7' }));
  svg.appendChild(mk('path', { d:area, fill:'url(#gG)' }));
  svg.appendChild(mk('path', { d:line, fill:'none', stroke:'#C9CDD3', 'stroke-width':1.5, 'stroke-dasharray':'3 5' }));
  const wipeG = mk('g', { 'clip-path':'url(#wipe)' }); svg.appendChild(wipeG);
  const usedG = mk('g', { 'clip-path':'url(#used)' }); wipeG.appendChild(usedG);
  usedG.appendChild(mk('path', { d:area, fill:'url(#gB)' }));
  usedG.appendChild(mk('path', { d:line, fill:'none', stroke:'#2B9CFF', 'stroke-width':3, 'stroke-linecap':'round' }));
  wipeG.appendChild(mk('circle', { cx:x(890), cy:y(gen(890)), r:6, fill:'#fff', stroke:'#2B9CFF', 'stroke-width':3 }));
  [[480,'8AM'],[720,'12PM'],[960,'4PM']].forEach(([t, l]) => {
    const e = mk('text', { x:x(t), y:B + 26, 'text-anchor':t === 480 ? 'start' : 'middle' }); e.textContent = l; svg.appendChild(e); });
  // 가전 3개: 큰 알약
  const JOBS = [['식기세척기', 660, 730, 0], ['세탁기', 705, 790, 1], ['건조기', 800, 890, 0]];
  JOBS.forEach(([n, a, b, lane], i) => {
    const g = mk('g', { class:'job' }); g.style.opacity = 0; g.style.transition = `opacity .5s ${0.6 + i * 0.3}s`;
    const yy = B + 44 + lane * 36;
    g.appendChild(mk('rect', { x:x(a), y:yy, width:x(b) - x(a), height:30, rx:15, fill:'#E3F1FF' }));
    const tx = mk('text', { x:(x(a) + x(b)) / 2, y:yy + 20, 'text-anchor':'middle' }); tx.style.fontSize = '14px'; tx.style.fill = '#1C78CC'; tx.textContent = n; g.appendChild(tx);
    svg.appendChild(g);
  });
  const cr = $('#wr');

  function count(el, to, d, dur = 1400, suf = ''){
    const t0 = performance.now();
    const step = () => { const p = Math.max(0, Math.min(1, (performance.now() - t0) / dur)), e = 1 - Math.pow(1 - p, 3);
      el.textContent = (to * e).toLocaleString('en-US', { minimumFractionDigits:d, maximumFractionDigits:d }) + suf; if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }

  /* ---------- 열기 / 닫기 ---------- */
  const BARE = location.search.includes('bare');        // 일정 화면 안에 겹쳐 띄울 때
  if (BARE){ $('#under').remove(); $('#again').remove(); document.documentElement.style.background = 'transparent'; document.body.style.background = 'transparent'; stage.style.background = 'transparent'; }
  const ov = $('#ov'), again = $('#again') || document.createElement('button');
  let isOpen = false;
  function open(){
    isOpen = true; again.classList.remove('on'); ov.classList.add('open'); stage.classList.remove('in');
    cr.setAttribute('width', 0); svg.querySelectorAll('.job').forEach(j => j.style.opacity = 0);
    setTimeout(() => {
      stage.classList.add('in');
      const w = W + 20, t0 = performance.now();
      svg.querySelectorAll('.job').forEach(j => j.style.opacity = 1);
      const grow = () => { const p = Math.min(1, (performance.now() - t0) / (STATIC ? 1 : 1800)); cr.setAttribute('width', w * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(grow); };
      requestAnimationFrame(grow);
      count($('#hPct'), 89, 0, 1400, '%');
      count($('#save'), 2860, 0, 1600);
    }, STATIC ? 0 : 350);
  }
  function close(){ isOpen = false; ov.classList.remove('open'); if (BARE){ try { parent.postMessage({ wello:'sum-close' }, '*'); } catch(e){} return; }
    setTimeout(() => { if (!isOpen) again.classList.add('on'); }, 500); }
  addEventListener('message', e => { if (e.data && e.data.wello === 'sum-open') open(); });
  ov.addEventListener('click', close);
  again.addEventListener('click', open);
  if (!BARE) open();
  window.__open = open; window.__close = close;

  /* ---------- 자동 시연: 결과 → 닫기 → 일정 → 다시 결과 ---------- */
  const finger = $('#finger');
  let g0 = 0, visible = true, idleT;
  const ABORT = {}, sleep = ms => new Promise(r => setTimeout(r, ms));
  async function wait(ms, g){ await sleep(ms); while (!visible || document.hidden) await sleep(250); if (g !== g0) throw ABORT; }
  function place(el){ const sr = stage.getBoundingClientRect(), k = sr.width / 1280, r = el.getBoundingClientRect();
    finger.style.transform = `translate(${(r.left + r.width/2 - sr.left) / k}px,${(r.top + r.height/2 - sr.top) / k}px)`; }
  async function tap(el, g, after){ finger.classList.add('show'); place(el); await wait(1100, g); place(el);
    finger.classList.remove('tap'); void finger.offsetWidth; finger.classList.add('tap'); el.click(); await wait(after, g); }
  async function demo(g){
    while (true){
      if (!isOpen) open();
      await wait(6500, g);
      await tap($('.hero'), g, 600);
      finger.classList.remove('show');
      await wait(5000, g);
      await tap(again, g, 400);
      finger.classList.remove('show');
    }
  }
  function start(){ const g = ++g0; demo(g).catch(e => { if (e !== ABORT) console.error(e); }); }
  function interrupt(e){ if (!e.isTrusted) return; g0++; finger.classList.remove('show'); clearTimeout(idleT); idleT = setTimeout(start, 15000); }
  ['pointerdown','keydown'].forEach(t => addEventListener(t, interrupt, true));
  if ('IntersectionObserver' in window) new IntersectionObserver(es => { visible = es[0].isIntersecting; }, { threshold:.3 }).observe(stage);
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !STATIC && !BARE) start();
}
</script>
</body>
</html>
