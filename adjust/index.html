const tLabels=()=>DLS.map(d=>d.l+'|까지');
const roll=(v)=>{const el=$('rcS');if(el.textContent===v)return;if(!el.textContent){el.textContent=v;return;}
 const y0=+el.getAttribute('y'),up=v>el.textContent?1:-1;const old=el.cloneNode(true);old.removeAttribute('id');el.parentNode.appendChild(old);
 el.textContent=v;const t0=performance.now();const D=380;
 const st=n=>{const k=Math.min(1,(n-t0)/D),e=1-Math.pow(1-k,3);old.setAttribute('y',y0-14*e*up);old.setAttribute('opacity',1-e);el.setAttribute('y',y0+14*(1-e)*up);el.setAttribute('opacity',e);
  if(k<1)RAF(st);else{old.remove();el.setAttribute('y',y0);el.setAttribute('opacity',1);}};RAF(st);};
const upd=()=>{try{fv();}catch(e){}_pk=PK[day]||750;const f=DAYS[day][2],st=startFor(DLS[tsel].m,f);const h=Math.floor(st/60),mm=String(st%60).padStart(2,'0');
 roll(((h%12)||12)+':'+mm);$('rcE').textContent=fmt(st+DUR)+' 완료';$('rcS').setAttribute('data-l',fmt(st));};
const WT=Wheel('wt',tLabels(),i=>{tsel=i;upd();});
const WD=Wheel('wd',DAYS.map(d=>d[1]+(d[0]==='오늘'||d[0]==='내일'?'|'+d[0]:'')),i=>{day=i;upd();});
const render=()=>{WD.set(day);tsel=dIdx();WT.set(tsel);upd();};
const row={setAttribute(){}};let dli=0,dx=0;
let open1=false,open2=false;
const rr=(id,on)=>{const w=$(id+'w');if(on){w.style.visibility='visible';w.style.pointerEvents='auto';setTimeout(()=>w.style.opacity=1,20);}else{w.style.opacity=0;w.style.visibility='hidden';w.style.pointerEvents='none';}};
const lay2=()=>{rr('wd',open1);rr('wt',open2);$('s2top').style.transform='translateY('+(open1||open2?-176:-44)+'px)';$('b2').style.transform='translateY('+(open1?132:0)+'px)';$('reco').style.transform='translateY('+((open1?132:0)+(open2?132:0)+28)+'px)';
 document.querySelector('#f1 .chev').style.transform=open1?'rotate(180deg)':'';document.querySelector('#f2 .chev').style.transform=open2?'rotate(180deg)':'';};
$('f1').addEventListener('click',()=>{open1=!open1;if(open1)open2=false;lay2();});
$('f2').addEventListener('click',()=>{open2=!open2;if(open2)open1=false;lay2();});
const fv=()=>{const d=DAYS[day];$('f1v').textContent=d[1]+(d[0]==='오늘'||d[0]==='내일'?'  '+d[0]:'');$('f2v').textContent=DLS[tsel].l+'  까지';};

const toast=t=>{$('tt').textContent=t;try{const w=$('tt').getComputedTextLength()+36;$('tr').setAttribute('width',w);$('tr').setAttribute('x',359-w/2);}catch(e){}$('toast').classList.add('on');clearTimeout(tm);tm=setTimeout(()=>$('toast').classList.remove('on'),2600);};
const setSub=t=>{const o=$('c'+ap+'sub'),n=$('c'+ap+'new');n.removeAttribute('transform');o.style.transition=n.style.transition='opacity .22s ease';o.style.opacity=0;n.style.opacity=0;setTimeout(()=>{n.textContent=t;n.style.opacity=1;},120);};
const closeAll=()=>root.classList.remove('open','s2');
$('go').addEventListener('click',e=>{if(sel===2){day=1;open1=false;open2=false;lay2();render();$('s2sub').textContent='발전 예보로 '+(ap===2?'건조':'세탁')+'하기 좋은 시간을 골랐어요';root.classList.add('s2');}else{closeAll();setTimeout(()=>{setSub('지금 작동 중 · 일반 전기 사용');toast(AP[ap]+'를 지금 시작했어요');},350);}});
$('go2').addEventListener('click',()=>{const d=DAYS[day][0],t=$('rcS').getAttribute('data-l');closeAll();setTimeout(()=>{setSub(d+' '+t+' 시작');toast(AP[ap]+'를 '+d+' '+t+'로 옮겼어요');},350);});
$('dim').addEventListener('click',closeAll);
render();

// ---- Live Activity (Dynamic Island)
const isl=$('island'),G={idle:[297,29521,124,36,18],comp:[272,29521,174,36,18],exp:[169,29519,380,84,34]};
let cur=G.idle.slice(),tw=0,laOn=false,laTm=0,laTick=0,total=98,left=98,laName='세탁기',laVerb='세탁';
const setI=g=>{isl.setAttribute('x',g[0]);isl.setAttribute('y',g[1]);isl.setAttribute('width',g[2]);isl.setAttribute('height',g[3]);isl.setAttribute('rx',g[4]);};
const tween=(to,ms=520)=>{const from=cur.slice(),t0=performance.now();CAF(tw);
 const sp=t=>{const c=1-Math.pow(1-t,3);return c+Math.sin(t*Math.PI)*.06;};
 const step=now=>{const t=Math.min(1,(now-t0)/ms),e=sp(t);cur=from.map((v,i)=>v+(to[i]-v)*e);setI(cur);if(t<1)tw=RAF(step);else{cur=to.slice();setI(cur);}};tw=RAF(step);};
const fmtEnd=m=>{const d=new Date(Date.now()+m*60000);let h=d.getHours(),mm=String(d.getMinutes()).padStart(2,'0');const ap=h<12?'오전':'오후';h=h%12||12;return ap+' '+h+':'+mm+' 완료';};
const stage=()=>left<=0?'완료':left<25?'탈수 중':left<55?'헹굼 중':laVerb+' 중';
const paint=()=>{$('laT').textContent=laName+' · '+stage();$('laM').textContent=left>0?left+'분':'완료';$('laCm').textContent=left>0?left+'분':'완료';
 $('laE').textContent=left>0?fmtEnd(left):'지금 꺼내도 돼요';$('laP').setAttribute('width',352*(1-left/total));};
const expand=(hold=3600)=>{tween(G.exp);$('laC').setAttribute('opacity',0);setTimeout(()=>$('laX').setAttribute('opacity',1),180);clearTimeout(laTm);
 if(hold)laTm=setTimeout(compact,hold);};
const compact=()=>{$('laX').setAttribute('opacity',0);setTimeout(()=>{tween(G.comp,460);setTimeout(()=>$('laC').setAttribute('opacity',1),220);},120);};
const idle=()=>{$('laX').setAttribute('opacity',0);$('laC').setAttribute('opacity',0);setTimeout(()=>tween(G.idle,420),120);};
const startLA=(name,verb,src)=>{laName=name;laVerb=verb;total=98;left=98;laOn=true;
 $('laS').textContent=src;paint();expand();clearInterval(laTick);
 laTick=setInterval(()=>{left=Math.max(0,left-1);paint();if(left===0){clearInterval(laTick);$('laS').textContent=laName+' 작동이 끝났어요';expand(0);setTimeout(()=>{idle();laOn=false;if(/bare/.test(location.search))setTimeout(()=>startLA('세탁기','세탁','태양광 전력으로 작동 중'),3000);},4200);}},700);};
$('la').addEventListener('click',e=>{e.stopPropagation();if(laOn)expand();});
if(location.hash==='#sheet')open(1);
if(/bare/.test(location.search)){$('device').style.display='none';$('sv').setAttribute('viewBox','158 29510 402 874');$('sv').setAttribute('preserveAspectRatio','xMidYMid slice');document.getElementById('ring').style.display='none';}

if(/auto/.test(location.search)){
 const sv=$('sv');const W=ms=>new Promise(r=>setTimeout(r,ms));
 const dot=el=>{try{const r=el.getBoundingClientRect(),m=sv.getScreenCTM().inverse(),p=sv.createSVGPoint();p.x=r.left+r.width/2;p.y=r.top+r.height/2;const q=p.matrixTransform(m);
  const c=document.createElementNS(NS,'circle');c.setAttribute('cx',q.x);c.setAttribute('cy',q.y);c.setAttribute('r',22);c.setAttribute('fill','rgba(30,31,34,.16)');c.style.transition='opacity .5s ease,r .5s ease';sv.appendChild(c);
  RAF(()=>{c.style.opacity=0;c.setAttribute('r',30);});setTimeout(()=>c.remove(),600);}catch(e){}};
 const tap=async id=>{const el=$(id);dot(el);await W(140);el.dispatchEvent(new MouseEvent('click',{bubbles:true}));};
 const reset=()=>{closeAll();[1,2].forEach(i=>{const n=$('c'+i+'new'),o=$('c'+i+'sub');n.style.transition=o.style.transition='opacity .3s ease';n.style.opacity=0;o.style.opacity=1;});};
 (async()=>{await W(1400);for(;;){
  await tap('c1');await W(1100);await tap('o2');await W(1500);
  await tap('f1');await W(800);WD.set(2,true);await W(1000);await tap('f1');await W(600);
  await tap('f2');await W(800);WT.set(Math.min(DLS.length-1,tsel+3),true);await W(1000);await tap('f2');await W(900);
  await tap('go2');await W(3200);
  await tap('c2');await W(1100);await tap('o1');await W(700);await tap('go');await W(3600);
  reset();await W(1600);}})();
}
