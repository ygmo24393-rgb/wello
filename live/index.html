 const sp=t=>{const c=1-Math.pow(1-t,3);return c+Math.sin(t*Math.PI)*.07;};
 const step=now=>{const t=Math.min(1,(now-t0)/ms),e=sp(t);cur=from.map((v,i)=>v+(to[i]-v)*e);setI(cur);if(t<1)tw=requestAnimationFrame(step);else{cur=to.slice();setI(cur);cb&&cb();}};tw=requestAnimationFrame(step);};

const comp=()=>{$('laX').setAttribute('opacity',0);setTimeout(()=>tween(G.comp,520,()=>$('laC').setAttribute('opacity',1)),260);};
const idle=()=>{$('laX').setAttribute('opacity',0);$('laC').setAttribute('opacity',0);setTimeout(()=>tween(G.idle,480),260);};
let tick=0,cyc=0;

 setTimeout(exp,900);
 clearInterval(tick);tick=setInterval(()=>{left=Math.max(0,left-1);paint();

 setTimeout(()=>{},0);};
