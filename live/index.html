<script>
const $=id=>document.getElementById(id),isl=$('island'),icr=$('iclipR');
const G={idle:[139,11,124,36,18],big:[10,8,382,104,44]};
let cur=G.idle.slice(),raf=0;
const setI=g=>['x','y','width','height','rx'].forEach((k,i)=>{isl.setAttribute(k,g[i]);icr.setAttribute(k,g[i]);});
const spring=t=>{const z=.68,w=14;const wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+z*w/wd*Math.sin(wd*t));};
const morph=(to,ms=900)=>{const from=cur.slice(),t0=performance.now();cancelAnimationFrame(raf);
 const st=now=>{const t=Math.min(1,(now-t0)/ms),e=spring(t*ms/1000);cur=from.map((v,i)=>v+(to[i]-v)*e);setI(cur);if(t<1)raf=requestAnimationFrame(st);else{cur=to.slice();setI(cur);}};raf=requestAnimationFrame(st);};
const on=(id,v)=>$(id).classList.toggle('on',v);
const sw=n=>['t1','t2','t3'].forEach((id,i)=>$(id).setAttribute('opacity',i===n?1:0));
const ring=p=>$('ring').setAttribute('stroke-dashoffset',144.5*(1-p));
const wait=ms=>new Promise(r=>setTimeout(r,ms));
// clock hands
const tickClock=()=>{const d=new Date(),s=d.getSeconds(),m=d.getMinutes()+s/60,h=(d.getHours()%12)+m/60;
 $('sh').setAttribute('transform','rotate('+s*6+' 30 30)');$('mh').setAttribute('transform','rotate('+m*6+' 30 30)');$('hh').setAttribute('transform','rotate('+h*30+' 30 30)');};
setInterval(tickClock,1000);tickClock();
const loop=async()=>{
 for(;;){
  sw(0);ring(0);await wait(1200);
  morph(G.big);await wait(260);on('cA',1);await wait(90);on('cB',1);await wait(90);on('cC',1);
  await wait(1700);
  sw(1);let left=32;
  for(let i=0;i<=40;i++){const p=i/40;ring(p);left=Math.max(0,Math.round(32*(1-p)));$('t2a').textContent=p<.45?'세탁 중':p<.8?'헹굼 중':'탈수 중';$('t2b').textContent='태양광 92% · '+left+'분 남음';await wait(95);}
  sw(2);await wait(2300);
  on('cC',0);await wait(70);on('cB',0);await wait(70);on('cA',0);await wait(160);
  morph(G.idle,800);await wait(1300);
 }
};
$('island').addEventListener('click',()=>{});
loop();
</script>
